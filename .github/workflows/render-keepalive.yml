name: Render Engine Keep Alive

on:
  schedule:
    # Render Free web services spin down after 15 minutes without inbound traffic.
    # Ping every 10 minutes to leave a safety margin.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake and verify Render engine
        run: |
          set -eu
          URL="https://job-application-automation-bot.onrender.com/healthz"
          CODE="$(curl --silent --show-error --location --max-time 90 --output /tmp/health.txt --write-out "%{http_code}" "$URL" || true)"
          echo "HTTP status: $CODE"
          cat /tmp/health.txt || true
          case "$CODE" in
            2*) echo "Engine health check succeeded." ;;
            *) echo "Engine health check failed."; exit 1 ;;
          esac
