version: '3.8'

services:
  jobpilot-app:
    build: .
    container_name: jobpilot_ai
    ports:
      - "3000:3000"
      - "8000:8000"
    environment:
      - NODE_PORT=3000
      - FASTAPI_PORT=8000
      - FASTAPI_URL=http://localhost:8000
      - PLAYWRIGHT_HEADLESS=true
      - HUMAN_IN_THE_LOOP_MODE=true
    volumes:
      - .:/app
    depends_on:
      - mongodb
      - redis
    restart: always

  mongodb:
    image: mongo:latest
    container_name: jobpilot_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: jobpilot_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: jobpilot_n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/

volumes:
  mongo_data:
  n8n_data:
