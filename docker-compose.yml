version: '3.8'

services:
  jobpilot-app:
    build: .
    container_name: jobpilot_ai
    ports:
      - "3000:3000"
      - "8000:8000"
    environment:
      - NODE_PORT=3000
      - FASTAPI_PORT=8000
      - FASTAPI_URL=http://localhost:8000
      - PLAYWRIGHT_HEADLESS=true
      - HUMAN_IN_THE_LOOP_MODE=true
    volumes:
      - .:/app
    depends_on:
      - mongodb
      - redis
    restart: always

  mongodb:
    image: mongo:latest
    container_name: jobpilot_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: jobpilot_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo_data:
